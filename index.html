<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sophie Mandal - Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --paper:#fdfcfa;
    --ink:#2c2836;
    --ink-soft:#6e6a7c;
    --ink-faint:#a8a4b6;
    --line:#eeecf3;

    --pink:#ffb0da;
    --pink-deep:#ff5fa8;
    --lav:#c6adff;
    --lav-deep:#9857ff;
    --mint:#84eeba;
    --mint-deep:#28d68c;
    --peach:#ffb27e;
    --peach-deep:#ff8534;
    --sky:#82d6ff;
    --sky-deep:#2bb0ff;
    --butter:#ffe14d;
    --butter-deep:#ffc700;

    --accent-a: var(--pink);
    --accent-b: var(--lav);
    --accent-a-deep: var(--pink-deep);
    --accent-b-deep: var(--lav-deep);
    --accent-pale: #fff3fa;

    --radius: 22px;
    --radius-sm: 14px;
    --shadow: 0 10px 30px -12px rgba(44,40,54,0.15);
    --shadow-lg: 0 24px 60px -20px rgba(44,40,54,0.22);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    font-weight:500;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,h4,.display{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0;
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer;}

  ::selection{ background:var(--accent-a); color:var(--ink); }

  /* ---------- Scroll reveal ---------- */
  .reveal{ opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .reveal{ opacity:1; transform:none; transition:none; }
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 5vw;
    background:rgba(253,252,250,0.82);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Baloo 2'; font-weight:700; font-size:1.15rem; }
  .brand .dot{
    width:14px; height:14px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--pink), var(--lav), var(--sky), var(--mint), var(--butter), var(--peach), var(--pink));
    animation:spin 6s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  nav.links{ display:flex; align-items:center; gap:6px; }
  .navlink{
    padding:9px 16px; border-radius:999px; font-weight:700; font-size:0.92rem;
    color:var(--ink-soft); transition:all .25s ease; position:relative;
  }
  .navlink:hover, .navlink.active{ background:var(--paper); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line); }
  .navlink.resume{
    background:var(--ink); color:var(--white);
  }
  .navlink.resume:hover{ background:#443f52; box-shadow:none; transform:translateY(-1px); }

  .dropdown{ position:relative; }
  .dropdown-panel{
    position:absolute; top:calc(100% + 10px); left:50%; transform:translateX(-50%) translateY(-8px);
    background:var(--white); border-radius:16px; box-shadow:var(--shadow-lg);
    padding:8px; width:250px; opacity:0; pointer-events:none; transition:all .22s ease;
    border:1px solid var(--line);
  }
  .dropdown:hover .dropdown-panel, .dropdown:focus-within .dropdown-panel{
    opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0);
  }
  .dropdown-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:10px; font-weight:700; font-size:0.88rem; color:var(--ink);
  }
  .dropdown-item:hover{ background:var(--paper); }
  .dropdown-item .chip{ width:10px; height:10px; border-radius:50%; flex:none; }

  .menu-toggle{ display:none; }

  /* ---------- Hero ---------- */
  .hero{
    position:relative; padding:12vh 6vw 10vh; text-align:center; overflow:hidden;
    min-height:78vh; display:flex; align-items:center; justify-content:center;
  }
  .hero-photo{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top center;
    opacity:0.16; z-index:0; filter:saturate(1.15);
  }
  .hero-photo-fade{
    position:absolute; inset:0; z-index:0;
    background:linear-gradient(180deg, var(--paper) 0%, rgba(253,252,250,0.55) 35%, var(--paper) 88%);
  }
  .blob{
    position:absolute; border-radius:50%; filter:blur(60px); opacity:0.65; z-index:0;
    animation:float 12s ease-in-out infinite;
  }
  .blob1{ width:340px; height:340px; background:var(--pink); top:-80px; left:2vw; animation-delay:0s;}
  .blob2{ width:280px; height:280px; background:var(--sky); top:10%; right:4vw; animation-delay:2s;}
  .blob3{ width:260px; height:260px; background:var(--mint); bottom:-60px; left:20vw; animation-delay:4s;}
  .blob4{ width:200px; height:200px; background:var(--butter); bottom:5%; right:22vw; animation-delay:1s;}
  @keyframes float{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(20px,-24px) scale(1.06); }
  }

  .hero-inner{ position:relative; z-index:1; max-width:780px; margin:0 auto; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--white); border:1.5px solid var(--line); border-radius:999px;
    padding:7px 16px; font-weight:800; font-size:0.8rem; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--ink-soft); box-shadow:var(--shadow); margin-bottom:22px;
  }
  .eyebrow .wave{ animation:wave 1.8s ease-in-out infinite; display:inline-block; transform-origin:70% 70%; }
  @keyframes wave{ 0%,100%{transform:rotate(0);} 20%{transform:rotate(16deg);} 40%{transform:rotate(-10deg);} 60%{transform:rotate(12deg);} 80%{transform:rotate(0);} }

  .hero h1{ font-size:clamp(2.4rem, 6vw, 4.4rem); line-height:1.05; }
  .hero h1 .grad{
    background:linear-gradient(100deg, var(--pink-deep), var(--lav-deep) 45%, var(--sky-deep));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p.sub{
    max-width:560px; margin:22px auto 0; font-size:1.15rem; color:var(--ink-soft); font-weight:700;
  }
  .hero-cta{ margin-top:36px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .btn{
    padding:14px 26px; border-radius:999px; font-weight:800; font-size:0.95rem;
    border:none; display:inline-flex; align-items:center; gap:8px; transition:all .25s cubic-bezier(.2,.8,.3,1.3);
  }
  .btn-primary{
    background:var(--ink); color:var(--white); box-shadow:0 10px 24px -8px rgba(44,40,54,0.4);
  }
  .btn-primary:hover{ transform:translateY(-3px) scale(1.02); box-shadow:0 16px 30px -10px rgba(44,40,54,0.45); }
  .btn-ghost{
    background:var(--white); color:var(--ink); border:2px solid var(--line);
  }
  .btn-ghost:hover{ border-color:var(--ink); transform:translateY(-3px); }

  /* ---------- Section shell ---------- */
  .section{ padding:6vh 6vw; max-width:1180px; margin:0 auto; }
  .section-head{ text-align:center; max-width:640px; margin:0 auto 44px; }
  .section-head .kicker{
    display:inline-block; font-weight:800; font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:10px;
  }
  .section-head h2{ font-size:clamp(1.7rem, 3.4vw, 2.5rem); }
  .section-head p{ color:var(--ink-soft); font-weight:600; margin-top:12px; font-size:1.02rem; }

  /* ---------- Project grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:26px;
  }
  @media(max-width:980px){ .grid{ grid-template-columns:repeat(2,1fr);} }
  @media(max-width:640px){ .grid{ grid-template-columns:1fr;} }

  .card{
    position:relative; border-radius:var(--radius); overflow:hidden; background:var(--white);
    box-shadow:var(--shadow); cursor:pointer; border:1px solid var(--line);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
    aspect-ratio:4/5; display:block;
  }
  .card:hover{ transform:translateY(-8px) rotate(-0.4deg); box-shadow:var(--shadow-lg); }
  .card .cover{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transition:transform .6s ease, filter .4s ease;
  }
  .card:hover .cover{ transform:scale(1.08); }
  .card .tint{
    position:absolute; inset:0; opacity:0.16; mix-blend-mode:multiply; transition:opacity .4s ease;
  }
  .card:hover .tint{ opacity:0.28; }
  .card .label{
    position:absolute; left:16px; top:16px; z-index:2;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(6px);
    padding:6px 13px; border-radius:999px; font-weight:800; font-size:0.72rem;
    letter-spacing:0.02em; box-shadow:var(--shadow);
  }
  .card .overlay{
    position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; justify-content:flex-end;
    padding:22px; background:linear-gradient(180deg, rgba(44,40,54,0) 35%, rgba(30,27,38,0.92) 100%);
    opacity:0; transition:opacity .35s ease;
  }
  .card:hover .overlay{ opacity:1; }
  .card .overlay h3{ color:var(--white); font-size:1.28rem; margin-bottom:8px; transform:translateY(8px); transition:transform .35s ease; }
  .card .overlay p{ color:rgba(255,255,255,0.86); font-size:0.87rem; font-weight:600; margin:0; opacity:0; transform:translateY(8px); transition:all .4s ease .05s; }
  .card:hover .overlay h3, .card:hover .overlay p{ transform:translateY(0); opacity:1; }
  .card .arrow{
    position:absolute; right:22px; bottom:22px; z-index:2; width:38px; height:38px; border-radius:50%;
    background:var(--white); display:flex; align-items:center; justify-content:center;
    opacity:0; transform:scale(0.6) rotate(-30deg); transition:all .35s cubic-bezier(.2,.8,.3,1.4);
  }
  .card:hover .arrow{ opacity:1; transform:scale(1) rotate(0deg); }

  /* base (static) label under card for touch devices */
  .card-base-label{ display:none; }
  @media (hover:none){
    .card .overlay{ opacity:1; background:linear-gradient(180deg, rgba(44,40,54,0) 50%, rgba(30,27,38,0.88) 100%); }
    .card .overlay h3, .card .overlay p{ opacity:1; transform:none; }
    .card .arrow{ opacity:1; transform:none; }
  }

  /* ---------- About preview ---------- */
  .about-preview{
    display:grid; grid-template-columns:1fr 1fr; gap:50px; align-items:center;
    background:var(--white); border-radius:32px; padding:50px; border:1px solid var(--line); box-shadow:var(--shadow);
  }
  @media(max-width:840px){ .about-preview{ grid-template-columns:1fr; padding:30px; } }
  .about-preview img{ border-radius:22px; width:100%; aspect-ratio:1/1.1; object-fit:cover; }
  .pill-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
  .pill{
    padding:7px 14px; border-radius:999px; font-weight:700; font-size:0.82rem; color:var(--ink);
  }

  /* ---------- Footer ---------- */
  footer{
    padding:60px 6vw 40px; text-align:center; border-top:1px solid var(--line); margin-top:40px;
  }
  footer h2{ font-size:clamp(1.6rem,3.5vw,2.4rem); margin-bottom:16px; }
  .social-row{ display:flex; gap:14px; justify-content:center; margin:26px 0; }
  .social-row a{
    width:46px; height:46px; border-radius:50%; background:var(--white); border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; transition:all .25s ease; box-shadow:var(--shadow);
  }
  .social-row a:hover{ transform:translateY(-4px) scale(1.08); border-color:transparent; background:var(--accent-a); }
  footer .fine{ color:var(--ink-faint); font-size:0.85rem; margin-top:30px; font-weight:600; }

  /* ================= PROJECT PAGE ================= */
  .proj-page{
    background: linear-gradient(180deg, var(--accent-a) 0%, var(--accent-pale) 26%, var(--white) 46%, var(--white) 60%, var(--accent-pale) 82%, var(--accent-b) 100%);
  }
  .proj-hero{
    position:relative; padding:15vh 6vw 12vh; text-align:center; overflow:hidden;
  }
  .proj-hero::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 82% 8%, var(--accent-b), transparent 55%),
               radial-gradient(circle at 10% 90%, var(--accent-a-deep), transparent 45%);
    opacity:0.55;
  }
  .proj-hero-inner{ position:relative; z-index:2; max-width:760px; margin:0 auto; }
  .back-link{
    display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:0.88rem;
    background:rgba(255,255,255,0.8); backdrop-filter:blur(8px); padding:9px 18px; border-radius:999px;
    margin-bottom:28px; box-shadow:var(--shadow); transition:all .25s ease;
  }
  .back-link:hover{ transform:translateX(-4px); background:var(--white); }
  .proj-tag{
    display:inline-block; background:var(--white); padding:7px 16px; border-radius:999px;
    font-weight:800; font-size:0.78rem; letter-spacing:0.03em; text-transform:uppercase; margin-bottom:20px;
    box-shadow:var(--shadow);
  }
  .proj-hero h1{ font-size:clamp(2.1rem,5vw,3.6rem); line-height:1.08; }
  .proj-hero .proj-sub{ margin-top:16px; font-weight:700; color:var(--ink-soft); font-size:1.1rem; }

  .proj-body{ max-width:880px; margin:0 auto; padding:6vh 6vw 4vh; position:relative; z-index:1; }
  .proj-body p{ font-size:1.06rem; color:#3a3646; margin-bottom:22px; }
  .proj-body h2{
    font-size:1.7rem; margin:56px 0 20px; padding-top:6px; position:relative; display:inline-block;
  }
  .proj-body h2::after{
    content:''; position:absolute; left:0; bottom:-8px; height:11px; width:60%;
    background:var(--accent-a-deep); border-radius:6px; z-index:-1; opacity:0.55;
  }
  .proj-link-box{
    display:flex; align-items:center; gap:14px; background:var(--white); border:1.5px dashed var(--accent-a-deep);
    border-radius:18px; padding:18px 22px; margin:26px 0 8px; font-weight:700; box-shadow:var(--shadow);
  }
  .proj-link-box a{ color:var(--ink); text-decoration:underline; text-decoration-color:var(--accent-a-deep); text-underline-offset:3px; }

  /* ---- immersive section panel ---- */
  .immersive-panel{
    position:relative; border-radius:32px; padding:48px 6vw; margin:0 -6vw 10px;
    overflow:hidden;
  }
  .immersive-panel.tint-a{ background:linear-gradient(150deg, color-mix(in srgb, var(--accent-a) 32%, white), color-mix(in srgb, var(--accent-b) 20%, white)); }
  .immersive-panel .panel-inner{ max-width:880px; margin:0 auto; position:relative; z-index:1; }
  .immersive-panel .deco-blob{
    position:absolute; border-radius:50%; filter:blur(50px); opacity:0.5; z-index:0;
  }

  .gallery{
    display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin:26px 0 10px;
  }
  .gallery.single{ grid-template-columns:1fr; }
  .gallery.three{ grid-template-columns:repeat(3,1fr); }
  @media(max-width:640px){ .gallery, .gallery.three{ grid-template-columns:1fr; } }
  .gallery img{
    border-radius:18px; width:100%; height:100%; object-fit:cover; box-shadow:var(--shadow);
    transition:transform .4s ease, box-shadow .4s ease; cursor:zoom-in;
  }
  .gallery img:hover{ transform:translateY(-6px) scale(1.015); box-shadow:var(--shadow-lg); }

  /* ---- raw image (already has its own device frame baked in) ---- */
  .raw-item{
    width:240px; flex:none; border-radius:18px; overflow:hidden;
    box-shadow:var(--shadow-lg); transition:transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s ease;
  }
  .raw-item:hover{ transform:translateY(-10px) scale(1.08) !important; box-shadow:0 30px 60px -15px rgba(0,0,0,0.35); z-index:5; }
  .raw-item img{ width:100%; display:block; cursor:zoom-in; }

  /* ---- phone frame (Instagram-style mobile shots) ---- */
  .mosaic{ display:flex; flex-wrap:wrap; gap:34px; justify-content:center; align-items:flex-end; margin:34px 0 14px; padding:20px 0; }
  .frame-phone{
    width:220px; background:#1c1a22; border-radius:34px; padding:10px 9px;
    box-shadow:var(--shadow-lg); position:relative; flex:none;
    transition:transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .frame-phone:hover{ transform:translateY(-10px) scale(1.03) rotate(0deg) !important; }
  .frame-phone::before{
    content:''; position:absolute; top:10px; left:50%; transform:translateX(-50%);
    width:56px; height:16px; background:#1c1a22; border-radius:10px; z-index:2;
  }
  .frame-phone .screen{ border-radius:24px; overflow:hidden; background:#fff; aspect-ratio:337/600; }
  .frame-phone .screen img{ width:100%; height:100%; object-fit:cover; cursor:zoom-in; }

  /* ---- browser/slide frame (case study screenshots) ---- */
  .frame-browser{
    width:min(400px, 90vw); border-radius:18px; overflow:hidden; background:var(--white);
    box-shadow:var(--shadow-lg); flex:none; transition:transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .frame-browser:hover{ transform:translateY(-10px) scale(1.02) rotate(0deg) !important; z-index:5; }
  .frame-browser .bar{
    height:32px; background:#f0eef5; display:flex; align-items:center; gap:6px; padding:0 14px;
  }
  .frame-browser .bar span{ width:9px; height:9px; border-radius:50%; }
  .frame-browser img{ width:100%; height:auto; display:block; cursor:zoom-in; }

  /* ---- corkboard pin frame (social graphics) ---- */
  .pin-mosaic{ display:flex; flex-wrap:wrap; gap:26px 22px; justify-content:center; margin:30px 0 10px; padding:10px 0; }
  .frame-pin{
    width:190px; background:var(--white); padding:10px 10px 22px; border-radius:8px;
    box-shadow:var(--shadow-lg); position:relative; flex:none;
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .frame-pin:hover{ transform:translateY(-8px) scale(1.04) rotate(0deg) !important; z-index:5; }
  .frame-pin::before{
    content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:17px; height:17px; border-radius:50%; background:var(--accent-a-deep);
    box-shadow:0 3px 6px rgba(0,0,0,0.35), inset -2px -2px 3px rgba(0,0,0,0.25);
  }
  .frame-pin img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:3px; cursor:zoom-in; }

  /* ---- floating product card (microwave etc.) ---- */
  .frame-product{
    max-width:520px; margin:34px auto 14px; padding:40px; border-radius:28px; text-align:center;
    background:radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--accent-a) 45%, white), color-mix(in srgb, var(--accent-b) 20%, white));
  }
  .frame-product img{ border-radius:20px; box-shadow:var(--shadow-lg); margin:0 auto; cursor:zoom-in; }

  .proj-cta{
    max-width:820px; margin:60px auto 0; padding:40px; text-align:center; border-radius:26px;
    background:var(--accent-a-deep); position:relative; overflow:hidden; z-index:1;
  }
  .proj-cta h3{ font-size:1.5rem; margin-bottom:10px; color:var(--white); }
  .proj-cta p{ font-weight:700; margin-bottom:22px; color:rgba(255,255,255,0.92); }

  .other-projects{ padding:6vh 6vw 10vh; max-width:1180px; margin:0 auto; position:relative; z-index:1; }

  /* Lightbox */
  .lightbox{
    position:fixed; inset:0; background:rgba(20,18,26,0.86); z-index:999;
    display:flex; align-items:center; justify-content:center; padding:5vw;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .lightbox.open{ opacity:1; pointer-events:auto; }
  .lightbox img{ max-width:100%; max-height:88vh; border-radius:16px; box-shadow:0 30px 80px rgba(0,0,0,0.5); }
  .lightbox-close{
    position:absolute; top:26px; right:26px; width:46px; height:46px; border-radius:50%;
    background:var(--white); border:none; font-size:1.3rem; font-weight:800;
  }

  /* ================= ABOUT PAGE ================= */
  .about-page{
    background: linear-gradient(180deg, var(--sky) 0%, var(--accent-pale) 18%, var(--white) 34%);
  }
  .about-hero{
    padding:12vh 6vw 6vh; text-align:center; position:relative; overflow:hidden;
  }
  .about-grid{
    display:grid; grid-template-columns:0.8fr 1.2fr; gap:44px; max-width:1080px; margin:0 auto; padding:4vh 6vw 8vh; align-items:start;
    position:relative; z-index:1;
  }
  @media(max-width:840px){ .about-grid{ grid-template-columns:1fr; } }
  .about-photo{
    border-radius:26px; overflow:hidden; box-shadow:var(--shadow-lg); position:sticky; top:100px;
    transform:rotate(-2deg); border:8px solid var(--white); outline:3px solid var(--pink-deep);
  }
  .confetti{ position:absolute; z-index:0; opacity:0.9; }
  .interest-card{
    border-radius:22px; padding:28px; margin-bottom:20px;
    box-shadow:var(--shadow-lg); transition:transform .3s cubic-bezier(.2,.8,.2,1);
    position:relative; overflow:hidden;
  }
  .interest-card:nth-child(odd){ transform:rotate(-0.6deg); }
  .interest-card:nth-child(even){ transform:rotate(0.6deg); }
  .interest-card:hover{ transform:translateY(-6px) rotate(0deg) scale(1.01); }
  .interest-card h3{ font-size:1.2rem; margin-bottom:12px; display:flex; align-items:center; gap:10px; }
  .interest-card .icon{ font-size:1.5rem; }
  .interest-card p{ margin:0 0 6px; color:#3a3646; font-weight:600; font-size:0.97rem; }
  .interest-card .label{ font-weight:900; color:var(--ink); font-size:0.82rem; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:3px; opacity:0.65;}
  .stat-row{ display:flex; gap:14px; flex-wrap:wrap; margin-top:18px; }
  .stat-chip{
    background:rgba(255,255,255,0.6); border-radius:16px; padding:12px 18px; font-weight:800; font-size:0.85rem;
    display:flex; flex-direction:column; gap:2px;
  }
  .stat-chip b{ font-size:1.3rem; font-family:'Baloo 2'; }

  /* Utility */
  .center{ text-align:center; }
  .page{ animation:fadeIn .45s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  @media(max-width:840px){
    nav.links{ display:none; }
  }
</style>

const frameTypeMap = {
  "instagram":"raw",
  "adobe-doordash":"browser",
  "lumnus":"browser",
  "vpm":"pin",
  "sullivan":"pin",
  "microwave":"product"
};

const rotations = [-4, 3, -2, 5, -5, 2, -3, 4];

function mosaicHTML(imgs, title, slug){
  if(!imgs || imgs.length===0) return '';
  const type = frameTypeMap[slug] || 'gallery';

  if(type === 'raw'){
    const items = imgs.map((src,i) => `
      <div class="raw-item" style="margin-top:${i%2===0?'0':'26px'};">
        <img src="${src}" alt="${title}" loading="lazy" onclick="openLightbox('${src}')">
      </div>`).join('');
    return `<div class="mosaic">${items}</div>`;
  }

  if(type === 'phone'){
    const items = imgs.map((src,i) => `
      <div class="frame-phone" style="transform:rotate(${rotations[i%rotations.length]}deg); margin-top:${i%2===0?'0':'26px'};">
        <div class="screen"><img src="${src}" alt="${title}" loading="lazy" onclick="openLightbox('${src}')"></div>
      </div>`).join('');
    return `<div class="mosaic">${items}</div>`;
  }

  if(type === 'browser'){
    const items = imgs.map((src,i) => `
      <div class="frame-browser" style="transform:rotate(${rotations[i%rotations.length]*0.6}deg); margin-top:${i%2===0?'10px':'0'};">
        <div class="bar"><span style="background:var(--accent-a-deep)"></span><span style="background:var(--accent-b-deep)"></span><span style="background:var(--ink-faint)"></span></div>
        <img src="${src}" alt="${title}" loading="lazy" onclick="openLightbox('${src}')">
      </div>`).join('');
    return `<div class="mosaic">${items}</div>`;
  }

  if(type === 'pin'){
    const items = imgs.map((src,i) => `
      <div class="frame-pin" style="transform:rotate(${rotations[i%rotations.length]}deg);">
        <img src="${src}" alt="${title}" loading="lazy" onclick="openLightbox('${src}')">
      </div>`).join('');
    return `<div class="pin-mosaic">${items}</div>`;
  }

  if(type === 'product'){
    const items = imgs.map(src => `<div class="frame-product"><img src="${src}" alt="${title}" loading="lazy" onclick="openLightbox('${src}')"></div>`).join('');
    return items;
  }

  const cls = imgs.length===1 ? 'single' : imgs.length>=3 ? 'three' : '';
  const items = imgs.map(src => `<img src="${src}" alt="${title}" loading="lazy" onclick="openLightbox('${src}')">`).join('');
  return `<div class="gallery ${cls}">${items}</div>`;
}

/* ============ RENDER + ROUTE ============ */
function render(){
  const hash = location.hash || '#/';
  document.documentElement.style.setProperty('--accent-a', 'var(--pink)');
  document.documentElement.style.setProperty('--accent-b', 'var(--lav)');
  document.documentElement.style.setProperty('--accent-a-deep', 'var(--pink-deep)');
  document.documentElement.style.setProperty('--accent-b-deep', 'var(--lav-deep)');
  document.documentElement.style.setProperty('--accent-pale', '#fff3fa');

  let bodyHTML = '';
  let activeSlug = null;

  if(hash === '#/' || hash === ''){
    bodyHTML = homeHTML();
  } else if(hash === '#/about'){
    bodyHTML = aboutHTML();
  } else if(hash.startsWith('#/project/')){
    const slug = hash.replace('#/project/','');
    activeSlug = slug;
    bodyHTML = projectHTML(slug);
  } else {
    bodyHTML = homeHTML();
  }

  app.innerHTML = topbarHTML(activeSlug) + bodyHTML;
  window.scrollTo({top:0, behavior:'instant'});
  initReveal();
}

function initReveal(){
  const els = document.querySelectorAll('.reveal');
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.add('in'); obs.unobserve(e.target); }
    });
  }, {threshold:0.12});
  els.forEach(el=>obs.observe(el));
}

function openLightbox(src){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}
document.getElementById('lightbox').addEventListener('click', (e)=>{
  if(e.target.id === 'lightbox') closeLightbox();
});

window.addEventListener('hashchange', render);
render();
